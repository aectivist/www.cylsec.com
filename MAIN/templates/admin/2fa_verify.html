{% extends "base.html" %}
{% block title %}Two-Factor Authentication — CYLVERN SECURITY{% endblock %}

{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
  <div class="card" style="width:100%;max-width:380px;padding:36px;text-align:center;">
    <div style="font-size:2rem;margin-bottom:12px;color:var(--purple);">
      <i class="fas fa-shield-alt"></i>
    </div>
    <div style="font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:800;margin-bottom:4px;">
      Two-Factor Auth
    </div>
    <p style="color:var(--text-muted);font-size:.88rem;margin-bottom:24px;">
      Enter the 6-digit code from your authenticator app.
    </p>

    <form method="POST" novalidate style="text-align:left;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="code">Authenticator Code</label>
        <input type="text" id="code" name="code" class="form-control"
               autocomplete="one-time-code" inputmode="numeric"
               maxlength="6" placeholder="000000" autofocus required
               style="letter-spacing:.3em;font-size:1.4rem;text-align:center;">
        {% if form.code.errors %}
          <small style="color:var(--danger);font-size:.82rem;">{{ form.code.errors[0] }}</small>
        {% endif %}
      </div>
      <button type="submit" class="btn btn-primary w-full" style="margin-top:8px;">
        <i class="fas fa-check-circle"></i> Verify
      </button>
    </form>

    <p style="margin-top:20px;">
      <a href="{{ url_for('admin_login') }}" style="color:var(--text-muted);font-size:.82rem;">
        &larr; Back to login
      </a>
    </p>
  </div>
</div>
{% endblock %}
