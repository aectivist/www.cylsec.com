{% extends "base.html" %}
{% block title %}Admin Login — CYLVERN SECURITY{% endblock %}

{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
  <div class="card" style="width:100%;max-width:380px;padding:36px;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:4px;">
        CYLVERN<span style="color:var(--purple);">SEC</span>
      </div>
      <p style="color:var(--text-muted);font-size:.9rem;">Admin Panel</p>
    </div>

    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control"
               autocomplete="username" required autofocus
               value="{{ form.username.data or '' }}">
        {% if form.username.errors %}
          <small style="color:var(--danger);font-size:.82rem;">{{ form.username.errors[0] }}</small>
        {% endif %}
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               autocomplete="current-password" required>
        {% if form.password.errors %}
          <small style="color:var(--danger);font-size:.82rem;">{{ form.password.errors[0] }}</small>
        {% endif %}
      </div>

      <button type="submit" class="btn btn-primary w-full" style="margin-top:8px;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
