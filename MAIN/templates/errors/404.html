{% extends "base.html" %}
{% block title %}404 Not Found — Cylvern Security{% endblock %}
{% block content %}
<div class="wip-wrap">
    <div style="text-align:center;">
        <i class="fas fa-ghost" style="font-size:3.5rem;color:rgba(124,77,255,.45);display:block;margin-bottom:20px;"></i>
        <h1 style="font-family:'Orbitron',sans-serif;font-size:clamp(2rem,5vw,3.5rem);color:var(--purple);margin-bottom:8px;">404</h1>
        <h2 style="color:var(--text);margin-bottom:12px;">Page Not Found</h2>
        <p style="color:var(--muted);max-width:380px;margin:0 auto 28px;font-size:.93rem;">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
    </div>
</div>
{% endblock %}
