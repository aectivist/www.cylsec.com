{% extends "base.html" %}

        <i class="fas fa-ban" style="font-size:3.5rem;color:rgba(255,82,82,.45);display:block;margin-bottom:20px;"></i>
        <h1 style="font-family:'Orbitron',sans-serif;font-size:clamp(2rem,5vw,3.5rem);color:var(--danger);margin-bottom:8px;">403</h1>

        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
