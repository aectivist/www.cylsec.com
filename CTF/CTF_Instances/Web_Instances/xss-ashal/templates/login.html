<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashal's Wall — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0d0d; color: #e0e0e0; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 40px; width: 100%; max-width: 380px; }
        h1 { font-size: 1.2rem; color: #7fff7f; margin-bottom: 6px; }
        .sub { font-size: .8rem; color: #555; margin-bottom: 28px; }
        label { display: block; font-size: .8rem; color: #888; margin-bottom: 6px; }
        input[type=text] { width: 100%; background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 4px; color: #e0e0e0; padding: 10px 12px; font-family: inherit; font-size: .9rem; margin-bottom: 20px; outline: none; }
        input[type=text]:focus { border-color: #7fff7f; }
        button { width: 100%; background: #7fff7f; color: #0d0d0d; border: none; border-radius: 4px; padding: 11px; font-family: inherit; font-size: .9rem; font-weight: bold; cursor: pointer; }
        button:hover { background: #5fdf5f; }
        .flashes { margin-bottom: 16px; }
        .flash { padding: 8px 12px; border-radius: 4px; font-size: .82rem; margin-bottom: 6px; }
        .flash-warning { background: rgba(255,193,7,.12); border: 1px solid rgba(255,193,7,.3); color: #ffc107; }
        .flash-success { background: rgba(127,255,127,.1); border: 1px solid rgba(127,255,127,.3); color: #7fff7f; }
        .flash-info    { background: rgba(100,180,255,.1); border: 1px solid rgba(100,180,255,.3); color: #64b4ff; }
    </style>
</head>
<body>
<div class="card">
    <h1>Ashal's Inscription Wall</h1>
    <p class="sub">Enter any username to begin.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flashes">
        {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    <form method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus autocomplete="off" placeholder="hunter_01">
        <button type="submit">Enter</button>
    </form>
</div>
</body>
</html>
