{% extends "base.html" %}
{% block title %}Reset Password — CYLVERN CTF{% endblock %}
{% block hero %}{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;">
  <div class="panel" style="width:100%;max-width:380px;padding:36px;">
    <h2 style="font-family:'Orbitron',sans-serif;font-size:1.1rem;text-align:center;margin-bottom:24px;">New Password</h2>
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:.82rem;color:#aaa;margin-bottom:6px;">New Password</label>
        <input type="password" name="password" class="form-control" autofocus required>
        {% if form.password.errors %}<p style="color:#ff5252;font-size:.78rem;margin-top:4px;">{{ form.password.errors[0] }}</p>{% endif %}
      </div>
      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:.82rem;color:#aaa;margin-bottom:6px;">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
