{% extends "base.html" %}
{% block title %}Verify OTP — CYLVERN CTF{% endblock %}
{% block hero %}{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;">
  <div class="panel" style="width:100%;max-width:360px;padding:36px;text-align:center;">
    <h2 style="font-family:'Orbitron',sans-serif;font-size:1rem;margin-bottom:20px;">Enter OTP</h2>
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="otp" class="form-control" inputmode="numeric" maxlength="6"
             placeholder="000000" autofocus style="letter-spacing:.3em;font-size:1.3rem;text-align:center;margin-bottom:20px;">
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Verify OTP</button>
    </form>
  </div>
</div>
{% endblock %}
