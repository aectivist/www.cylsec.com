{% extends "base.html" %}
{% block title %}Two-Factor Auth — CYLVERN CTF{% endblock %}
{% block hero %}{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;">
  <div class="panel" style="width:100%;max-width:360px;padding:36px;text-align:center;">
    <div style="font-size:2rem;color:var(--purple);margin-bottom:12px;"><i class="fas fa-shield-alt"></i></div>
    <h2 style="font-family:'Orbitron',sans-serif;font-size:1rem;margin-bottom:20px;">Two-Factor Auth</h2>
    <p style="color:#aaa;font-size:.85rem;margin-bottom:24px;">Enter the 6-digit code from your authenticator app.</p>
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="token" class="form-control" inputmode="numeric" maxlength="6"
             placeholder="000000" autofocus autocomplete="one-time-code"
             style="letter-spacing:.3em;font-size:1.3rem;text-align:center;margin-bottom:20px;">
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Verify</button>
    </form>
    <p style="margin-top:16px;font-size:.82rem;"><a href="{{ url_for('auth.login') }}" style="color:#666;">← Back to login</a></p>
  </div>
</div>
{% endblock %}
