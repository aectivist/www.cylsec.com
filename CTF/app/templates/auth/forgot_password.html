{% extends "base.html" %}
{% block title %}Forgot Password — CYLVERN CTF{% endblock %}
{% block hero %}{% endblock %}
{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;">
  <div class="panel" style="width:100%;max-width:380px;padding:36px;">
    <h2 style="font-family:'Orbitron',sans-serif;font-size:1.1rem;text-align:center;margin-bottom:24px;">Reset Password</h2>
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:.82rem;color:#aaa;margin-bottom:6px;">Email Address</label>
        <input type="email" name="email" class="form-control" autofocus required value="{{ form.email.data or '' }}">
        {% if form.email.errors %}<p style="color:#ff5252;font-size:.78rem;margin-top:4px;">{{ form.email.errors[0] }}</p>{% endif %}
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Send Reset Link</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:.85rem;color:#aaa;">
      <a href="{{ url_for('auth.login') }}" style="color:var(--purple);">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
