{% extends "admin/base_admin.html" %}
{% block title %}Admin — Verify 2FA{% endblock %}

{% block admin_content %}
<h2 class="section-title" style="margin-bottom:20px;">Two-Factor Verification</h2>
<div class="panel" style="max-width:360px;text-align:center;">
  <p style="color:var(--muted);font-size:.88rem;margin-bottom:20px;">Enter your authenticator code to continue.</p>
  <form method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="token" class="form-control" placeholder="6-digit code" maxlength="6" autocomplete="one-time-code" style="text-align:center;letter-spacing:.2em;font-size:1.2rem;margin-bottom:12px;">
    <button type="submit" class="btn-primary" style="width:100%;">Verify</button>
  </form>
</div>
{% endblock %}
