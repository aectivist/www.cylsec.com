# ctf.cylsec.com  →  gunicorn on 127.0.0.1:5000

server {
    listen 80;
    listen [::]:80;
    server_name ctf.cylsec.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ctf.cylsec.com;

    # --- SSL certs (filled in by certbot) ---
    # ssl_certificate     /etc/letsencrypt/live/ctf.cylsec.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ctf.cylsec.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /static/ {
        alias /root/www.cylsec.com/CTF/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
