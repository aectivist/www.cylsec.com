# ctf.cylsec.com  →  gunicorn on 127.0.0.1:5000
#
# PHASE 1 (current): HTTP only — proxy all traffic directly to gunicorn.
#   After running: certbot --nginx -d ctf.cylsec.com
#   certbot will rewrite this file to add SSL and the 301 redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name ctf.cylsec.com;

    # Certbot ACME challenge passthrough (needed during cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Increase body size limit (default 1M is too small for file uploads)
    client_max_body_size 50M;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass            http://127.0.0.1:5000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_buffer_size     128k;
        proxy_buffers         4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /static/ {
        alias /root/www.cylsec.com/CTF/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# PHASE 2 (after certbot): certbot --nginx -d ctf.cylsec.com will automatically:
#   - Add ssl_certificate / ssl_certificate_key directives above
#   - Change listen 80 to redirect 301 → https
#   - Add a new listen 443 ssl http2 block with HSTS
# Once HTTPS is live, also set in /root/www.cylsec.com/CTF/.env:
#   SESSION_COOKIE_SECURE=true
#   REMEMBER_COOKIE_SECURE=true
# Then: systemctl restart cylvern-ctf
